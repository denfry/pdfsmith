[workspace]
resolver = "2"
members = [
    "crates/pdfsmith-pdfium",
    "crates/pdfsmith-engine",
    "crates/pdfsmith-app",
    "crates/pdfsmith-update",
    "crates/pdfsmith-sign",
]

[workspace.package]
edition = "2021"
version = "0.1.5"
license = "Proprietary"
authors = ["PDFsmith"]
rust-version = "1.88"

[workspace.dependencies]
pdfsmith-pdfium = { path = "crates/pdfsmith-pdfium" }
pdfsmith-engine = { path = "crates/pdfsmith-engine" }
pdfsmith-update = { path = "crates/pdfsmith-update" }
pdfsmith-sign = { path = "crates/pdfsmith-sign" }
thiserror = "2"
log = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Dev/test-сборки без отладочной информации: в разы меньше места на диске и
# быстрее линковка. Для отладки с бэктрейсами включить `debug = 1` локально.
[profile.dev]
debug = 0

[profile.test]
debug = 0
