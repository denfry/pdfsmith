[package]
name = "pdfsmith-app"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "pdfsmith"
path = "src/main.rs"

[dependencies]
pdfsmith-engine.workspace = true
pdfsmith-pdfium.workspace = true
pdfsmith-update.workspace = true
log.workspace = true
eframe = { version = "0.30.0", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
pollster = "1.0"
# eframe подключает wgpu без DX12 — включаем явно (единственный путь к WARP на ПК без видеодрайвера).
wgpu = { version = "23.0.1", default-features = false, features = ["dx12", "wgsl"] }
env_logger = "0.11.10"
rfd = { version = "0.17.2", default-features = false }
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff", "webp"] }
egui-phosphor = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_System_Com"] }

[build-dependencies]
winresource = "0.1"
