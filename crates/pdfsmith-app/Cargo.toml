[package]
name = "pdfsmith-app"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
pdfsmith-engine.workspace = true
pdfsmith-pdfium.workspace = true
log.workspace = true
eframe = { version = "0.30.0", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
env_logger = "0.11.10"
rfd = { version = "0.17.2", default-features = false }
image = { version = "0.25.6", default-features = false, features = ["png"] }
